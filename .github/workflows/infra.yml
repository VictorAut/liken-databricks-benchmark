name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - .github/actions/infra-auth/**
  workflow_dispatch:
    inputs:
      plan:
        required: false
        default: false
        type: boolean
      apply:
        required: false
        default: false
        type: boolean
      destroy:
        required: false
        default: false
        type: boolean


permissions:
  contents: read
  id-token: write

# One state bucket, one account: every run serialises, whatever branch
# it comes from. Queued, not cancelled.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  # Read-only plan: on PRs for review, on dispatch as plan inspection
  # or as the first half of an apply. No environment gate: plan is
  # read-only, and PR runs must not wait on environment approval.
  #
  # PRs receive AWS and Databricks credentials by design. The repo has
  # a single committer, plan only reads (state refresh), and fork PRs
  # get no secrets from GitHub anyway. Residual risk: the Databricks
  # service principal is account-admin. Scope it down before adding
  # collaborators.
  plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.plan || inputs.apply))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}

      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false
      - name: Plan
        run: mise exec -- terraform -chdir=infra/main plan -input=false -out=tfplan

      # Apply consumes this exact plan; it never re-plans.
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/main/tfplan
          retention-days: 1
          if-no-files-found: error

  # Applies the plan produced in this run. Unlocked only by the manual
  # apply input; the protected benchmark environment gates the job.
  apply:
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.apply &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/main

      # Provider plugins for the plan file. init is idempotent and does
      # not touch the downloaded plan; the lock file pins the provider
      # versions to exactly the ones that produced the plan.
      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false

      # Nothing billable is created on top of a dirty account (D009).
      # This also blocks resume-after-partial-apply: resume means
      # destroy first.
      - name: Verify clean account
        run: mise exec -- task infra:verify-destroyed

      - name: Apply
        run: mise exec -- terraform -chdir=infra/main apply -input=false -auto-approve tfplan

  # Teardown, dispatched only. Bounded retry absorbs ENI/subnet races
  # (DependencyViolation); the strict verify task is the gate.
  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.destroy
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}

      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false

      - name: Destroy (attempt 1/3)
        id: destroy1
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve
      - name: Wait before retry
        if: steps.destroy1.outcome == 'failure'
        run: sleep 60
      - name: Destroy (attempt 2/3)
        id: destroy2
        if: steps.destroy1.outcome == 'failure'
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve
      - name: Wait before retry
        if: steps.destroy2.outcome == 'failure'
        run: sleep 60
      - name: Destroy (attempt 3/3)
        id: destroy3
        if: steps.destroy2.outcome == 'failure'
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve

      - name: Destroy failed after 3 attempts
        if: >-
          steps.destroy1.outcome != 'success' &&
          steps.destroy2.outcome != 'success' &&
          steps.destroy3.outcome != 'success'
        run: |
          echo "destroy failed on all 3 attempts" >&2
          exit 1
      - name: Verify teardown
        if: >-
          steps.destroy1.outcome == 'success' ||
          steps.destroy2.outcome == 'success' ||
          steps.destroy3.outcome == 'success'
        run: mise exec -- task infra:verify-destroyed
