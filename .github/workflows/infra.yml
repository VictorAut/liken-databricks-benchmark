name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - .github/actions/infra-auth/**
  workflow_dispatch:
    inputs:
      plan:
        required: false
        default: false
        type: boolean
      apply:
        required: false
        default: false
        type: boolean
      destroy:
        required: false
        default: false
        type: boolean


permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Exercises the verify task cheaply on every run: bad flags or
    # missing read permissions fail here in seconds, not after a
    # 20-minute destroy. Warning mode: the account may legitimately
    # hold resources when this runs.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.plan || inputs.apply || inputs.destroy))
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}
      - name: Verify task runs (warning mode)
        env:
          ALLOW_NONEMPTY: "1"
        run: mise exec -- task infra:verify-destroyed

  plan:
    # PR-only plan. No artifact: dispatch apply plans in its own job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}
      - name: Plan
        run: |
          mise exec -- terraform -chdir=infra/main init -input=false
          mise exec -- terraform -chdir=infra/main plan -input=false

  apply:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.apply &&
      !failure() && !cancelled()
    needs: smoke
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}
      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false
      - name: Verify clean account before apply
        run: mise exec -- task infra:verify-destroyed
      - name: Plan
        run: mise exec -- terraform -chdir=infra/main plan -input=false -out=tfplan
      - name: Apply
        run: mise exec -- terraform -chdir=infra/main apply -input=false -auto-approve tfplan

  destroy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.destroy &&
      !failure() && !cancelled()
    needs: smoke
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}
          single-user-email: ${{ secrets.SINGLE_USER_EMAIL }}
      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false

      # Bounded retry: ENIs from Databricks can outlive Terraform's
      # delete order (DependencyViolation). Idempotent re-runs absorb it.
      - name: Destroy (attempt 1/3)
        id: destroy1
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve
      - name: Wait before retry
        if: steps.destroy1.outcome == 'failure'
        run: sleep 60
      - name: Destroy (attempt 2/3)
        id: destroy2
        if: steps.destroy1.outcome == 'failure'
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve
      - name: Wait before retry
        if: steps.destroy2.outcome == 'failure'
        run: sleep 60
      - name: Destroy (attempt 3/3)
        id: destroy3
        if: steps.destroy2.outcome == 'failure'
        continue-on-error: true
        run: mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve

      - name: Destroy failed after 3 attempts
        if: >-
          steps.destroy1.outcome != 'success' &&
          steps.destroy2.outcome != 'success' &&
          steps.destroy3.outcome != 'success'
        run: |
          echo "destroy failed on all 3 attempts" >&2
          exit 1
      - name: Verify teardown
        if: >-
          steps.destroy1.outcome == 'success' ||
          steps.destroy2.outcome == 'success' ||
          steps.destroy3.outcome == 'success'
        run: mise exec -- task infra:verify-destroyed
