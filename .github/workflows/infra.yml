name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - .github/actions/infra-auth/**
  workflow_dispatch:
    inputs:
      plan:
        required: false
        default: false
        type: boolean
      apply:
        required: false
        default: false
        type: boolean
      destroy:
        required: false
        default: false
        type: boolean


permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.plan || inputs.apply))
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}

      - name: Plan
        run: |
          mise exec -- terraform -chdir=infra/main init -input=false
          mise exec -- terraform -chdir=infra/main plan -input=false -out=tfplan

      # The apply job must apply exactly this plan, not a fresh one.
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/main/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.apply &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}

      # Apply consumes the exact plan produced by the plan job.
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/main

      # Apply needs provider plugins installed; init is idempotent and
      # does not touch the downloaded plan.
      - name: Init
        run: mise exec -- terraform -chdir=infra/main init -input=false

      - name: Apply
        run: mise exec -- terraform -chdir=infra/main apply -input=false -auto-approve tfplan

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.destroy
    runs-on: ubuntu-latest
    environment: benchmark
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: mise tools
        uses: jdx/mise-action@v2
      - name: infra auth
        uses: ./.github/actions/infra-auth
        with:
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          databricks-account-id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          databricks-client-id: ${{ vars.DATABRICKS_ACCOUNT_CLIENT_ID }}

      - name: Destroy
        run: |
          mise exec -- terraform -chdir=infra/main init -input=false
          mise exec -- terraform -chdir=infra/main destroy -input=false -auto-approve

      # Empty-account checks in the same job: teardown cannot be
      # considered done unless these pass.
      - name: Verify no NAT gateway remains
        run: |
          test "$(mise exec -- aws ec2 describe-nat-gateways --region eu-central-1 \
            --filter Name=state,Values=available \
            --query 'length(NatGateways)' --output text)" = "0"

      - name: Verify no benchmark buckets remain
        run: |
          if mise exec -- aws s3 ls | grep liken-benchmark | grep -v tfstate; then
            echo "benchmark buckets still exist:" >&2
            exit 1
          fi

      - name: Verify only the default VPC remains
        run: |
          test "$(mise exec -- aws ec2 describe-vpcs --region eu-central-1 \
            --query 'length(Vpcs[?!(IsDefault == `true`)])' --output text)" = "0"
